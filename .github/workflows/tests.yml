name: Numerical tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: CUDA_VISIBLE_DEVICES='' python -m pytest aurum/tests benchmarks/tests experiments/tests experiments/test_confirmation.py -q
